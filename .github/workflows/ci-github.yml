name: Github CI

on: [push, pull_request]

permissions:
  contents: read

# Cancels previous runs of the same workflow
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

# The theorem-labs fork is built and run on Linux only, in the verification harness
# image, whose opam switch is ocaml-variants.4.14.2+options with
# ocaml-option-flambda. The first entry installs exactly that compiler. CI
# builds with dune's dev profile (`make world`), so the release-only
# -O3 -unbox-closures that the harness's `dune build -p` applies are not
# exercised here. The OCaml 5 entry keeps the fork building on current OCaml.
# macOS and Windows are not targets of this fork and are not in the matrix.
jobs:
  build:
    strategy:
      matrix:
        include:
          - name: Linux (OCaml 4.14.2 flambda)
            os: ubuntu-latest
            ocaml: ocaml-variants.4.14.2+options,ocaml-option-flambda
            test_disabled:
            packages: ./coqide-server.opam ./rocq*.opam
          - name: Linux (latest OCaml)
            os: ubuntu-latest
            ocaml: 5
            test_disabled:
            packages: ./coqide-server.opam ./rocq*.opam
      fail-fast: false

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: APT update
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update

      - name: 🔭 Checkout code
        uses: actions/checkout@v4

      - name: 🐫 Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          dune-cache: true

      - name: 🐫🐪🐫 Get Rocq dependencies
        run: opam install --deps-only ${{ matrix.packages }}

      - name: 🧱 Build Rocq
        run: opam exec -- make world

      - name: 🐛 Test Rocq
        run: opam exec -- make -j 4 -C test-suite TIMED=1 DISABLED_SUBSYSTEMS='${{ matrix.test_disabled }}'

  forge:
    name: Grade-mode forge check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: APT update
        run: sudo apt-get update

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.4.14.2+options,ocaml-option-flambda
          dune-cache: true

      - name: Get dependencies
        run: opam install --deps-only ./coqide-server.opam ./rocq*.opam

      - name: Build the commit under test
        run: env -u ROCQLIB -u COQLIB -u ROCQRUNTIMELIB opam exec -- make world

      # For each forge, build a copy of this commit with unfix.patch applied,
      # then run dev/ci/forge-check.sh. Every forge runs; the step fails if any
      # forge fails, or if there is no forge directory to check.
      # No -e here, so one failure does not stop the loop.
      - name: Check each forge
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          status=0
          checked=0
          for d in dev/ci/forge/*/; do
            [ -d "$d" ] || continue
            checked=$((checked + 1))
            d=${d%/}
            name=$(basename "$d")
            copy="$RUNNER_TEMP/reverted-$name"
            mkdir -p "$copy"
            if ! git archive HEAD | tar -x -C "$copy"; then
              echo "FAIL $name: cannot copy the source tree"
              status=1
              continue
            fi
            if ! (cd "$copy" && git apply "$GITHUB_WORKSPACE/$d/unfix.patch"); then
              echo "FAIL $name: unfix.patch does not apply"
              status=1
              continue
            fi
            echo "::group::Build the reverted copy ($name)"
            # The opam switch is local to the workspace, so name it here.
            (cd "$copy" && env -u ROCQLIB -u COQLIB -u ROCQRUNTIMELIB \
              opam exec --switch="$GITHUB_WORKSPACE" -- make world)
            built=$?
            echo "::endgroup::"
            if [ "$built" -ne 0 ]; then
              echo "FAIL $name: the reverted copy does not build"
              status=1
              continue
            fi
            if ! opam exec -- \
              dev/ci/forge-check.sh "$d" "$copy/_build/install/default" \
              "$GITHUB_WORKSPACE/_build/install/default"; then
              status=1
            fi
          done
          if [ "$checked" -eq 0 ]; then
            echo "FAIL: no forge directory under dev/ci/forge/"
            exit 1
          fi
          exit "$status"
