name: Github CI

on: [push, pull_request]

permissions:
  contents: read

# Cancels previous runs of the same workflow
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

# The continuous-integration matrix builds the supported Linux configuration.
# The OCaml 5 entry keeps that configuration current.
jobs:
  build:
    strategy:
      matrix:
        include:
          - name: Linux (OCaml 4.14.2 flambda)
            os: ubuntu-latest
            ocaml: ocaml-variants.4.14.2+options,ocaml-option-flambda
            test_disabled:
            packages: ./coqide-server.opam ./rocq*.opam
          - name: Linux (latest OCaml)
            os: ubuntu-latest
            ocaml: 5
            test_disabled:
            packages: ./coqide-server.opam ./rocq*.opam
      fail-fast: false

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: APT update
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update

      - name: 🔭 Checkout code
        uses: actions/checkout@v4

      - name: 🐫 Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          dune-cache: true

      - name: 🐫🐪🐫 Get Rocq dependencies
        run: opam install --deps-only ${{ matrix.packages }}

      - name: 🧱 Build Rocq
        run: opam exec -- make world

      - name: 🐛 Test Rocq
        run: opam exec -- make -j 4 -C test-suite TIMED=1 DISABLED_SUBSYSTEMS='${{ matrix.test_disabled }}'
