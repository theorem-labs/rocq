name: Github CI

on: [push, pull_request]

permissions:
  contents: read

# Cancels previous runs of the same workflow
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

# The theorem-labs fork is built and run on Linux only, in the BET grader
# image, whose opam switch is ocaml-variants.4.14.2+options with
# ocaml-option-flambda. The first entry installs exactly that compiler. CI
# builds with dune's dev profile (`make world`), so the release-only
# -O3 -unbox-closures that the grader's `dune build -p` applies are not
# exercised here. The OCaml 5 entry keeps the fork building on current OCaml.
# macOS and Windows are not targets of this fork and are not in the matrix.
jobs:
  census:
    # Per-proof replay census (dev/tools/census/README.md): every Summary, Libobject and catch-all
    # handler site has a census row or a written ruling.
    name: Census check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🔭 Checkout code
        uses: actions/checkout@v4

      - name: 🧪 Census check tests
        run: python3 -m unittest discover -s dev/tools/census -v

      - name: 📋 Census check
        run: python3 dev/tools/census/census_check.py --root . --rulings dev/tools/census/rulings/rocq.json

  build:
    strategy:
      matrix:
        include:
          - name: Linux (OCaml 4.14.2 flambda)
            os: ubuntu-latest
            ocaml: ocaml-variants.4.14.2+options,ocaml-option-flambda
            test_disabled:
            packages: ./coqide-server.opam ./rocq*.opam
          - name: Linux (latest OCaml)
            os: ubuntu-latest
            ocaml: 5
            test_disabled:
            packages: ./coqide-server.opam ./rocq*.opam
      fail-fast: false

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: APT update
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update

      - name: 🔭 Checkout code
        uses: actions/checkout@v4

      - name: 🐫 Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          dune-cache: true

      - name: 🐫🐪🐫 Get Rocq dependencies
        run: opam install --deps-only ${{ matrix.packages }}

      - name: 🧱 Build Rocq
        run: opam exec -- make world

      - name: 🐛 Test Rocq
        run: opam exec -- make -j 4 -C test-suite TIMED=1 DISABLED_SUBSYSTEMS='${{ matrix.test_disabled }}'

  proof-replay:
    # Per-proof replay fixtures (test-suite/proof-replay/README.md): every fixture, the slow ones
    # too. `make -C test-suite proof-replay` fails when a fixture fails or does not run.
    # ineligible_native_compute needs native_compute, so Rocq is configured with
    # -native-compiler ondemand; the build jobs above keep the default (no native code).
    # eval_zify_table, ineligible_external_prover and vm_lia_hit load Stdlib, so the job
    # builds the Stdlib that dev/ci/ci-basic-overlay.sh pins, the way dev/ci does.
    name: Proof replay fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: APT update
        run: sudo apt-get update

      - name: 🔭 Checkout code
        uses: actions/checkout@v4

      - name: 🧪 Fixture runner tests
        run: python3 test-suite/proof-replay/test_vo_exempt.py

      - name: 🐫 Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.4.14.2+options,ocaml-option-flambda
          dune-cache: true

      - name: 🐫🐪🐫 Get Rocq dependencies
        run: opam install --deps-only ./coqide-server.opam ./rocq*.opam

      - name: ⚙️ Configure Rocq with native_compute on demand
        run: opam exec -- ./configure -relocatable -native-compiler ondemand

      - name: 🧱 Build Rocq
        run: opam exec -- make world

      - name: 📚 Build Stdlib
        run: opam exec -- make -f Makefile.ci ci-stdlib

      - name: 🔁 Proof replay fixtures
        run: opam exec -- make -j 4 -C test-suite TIMED=1 proof-replay
